server:
  port: 8081
  servlet:
    context-path: /api
logging:
  level:
    com.example.bankrest.security.JwtAuthFilter: DEBUG

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/migration/migration.yaml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:bezopasno-klanus-klanus-klanus22}
  encryption:
    aes:
      key: ${ENCRYPTION_KEY:bezopasno-klanus-klanus-klanus11}